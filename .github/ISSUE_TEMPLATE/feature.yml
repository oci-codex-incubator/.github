name: Feature or project proposal
description: Propose a focused improvement or a new incubator project.
title: "Proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Users and problem
      description: Who needs this, and what repeated problem do they face?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful outcome
      description: Proposed behavior, alternatives, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: How will we know it works? Include OCI services and operational impact where relevant.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and related work
      description: Proposed maintainer for new projects, plan links, and related issues.
