name: Bug report
description: Report a reproducible problem with a project, skill, or starter.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include credentials, real OCI identifiers, complete PAR URLs, or customer data."
  - type: input
    id: revision
    attributes:
      label: Repository revision and environment
      description: Commit/tag, OS, runtime, skill, and format where relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include minimal commands or a sanitized example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification and sanitized evidence
      description: Checks run, relevant output, and known workarounds.
